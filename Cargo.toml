[package]
name = "fedeweather"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "FedeWeather — clima real, en tiempo real. SPA en Rust + WASM."
license = "MIT"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc", "wasmbind"] }
gloo-timers = { version = "0.4", features = ["futures"] }
futures-util = "0.3"

# En wasm32 reqwest usa automáticamente el backend `fetch` del navegador.
# No existe una feature "wasm" en reqwest 0.13: se activa por target.
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
futures-channel = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "MouseEvent",
  "Storage",
  "Navigator",
  "Geolocation",
  "Position",
  "PositionError",
  "PositionOptions",
  "Coordinates",
  "Location",
  "DomRect",
  "HtmlCollection",
  "NodeList",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
